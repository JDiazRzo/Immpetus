# Backend en local. La base de datos local la levanta la CLI de Supabase: `supabase start`.
services:
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8080"
    volumes:
      - ./backend/app:/app/app   # recarga en caliente al editar
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
